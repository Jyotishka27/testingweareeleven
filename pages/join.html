<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Memberships — We Are Eleven</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Favicon -->
  <link rel="icon" href="../assets/group-logo/we_are_eleven_logo.jpg" />
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen antialiased">

  <!-- Shared Header -->
  <div id="site-header"></div>

  <!-- Hero -->
  <section class="bg-slate-950 text-white py-16 px-6 text-center relative overflow-hidden">
    <div class="max-w-3xl mx-auto space-y-3 relative z-10">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-semibold uppercase tracking-wider">
        ⚽ Community Tiers & Game Packages
      </div>
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight">Choose Your Membership</h1>
      <p class="text-slate-300 max-w-xl mx-auto text-base">
        Free Play is for spectator and social access. To participate in weekly turf games and vote on fixtures, choose Silver, Gold, or Platinum.
      </p>
    </div>
  </section>

  <!-- Membership Cards -->
  <main class="flex-grow max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8 w-full">
    <div
      id="plans"
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-slate-950 py-8 text-center text-slate-400 text-sm border-t border-slate-800">
    <p>© 2026 We Are Eleven Community. All Rights Reserved.</p>
  </footer>

  <!-- Logic -->
  <script type="module">
    import { injectHeader } from "../scripts/header.js";
    injectHeader("#site-header", { active: "memberships" });

    // Static membership plans
    const PLANS = {
      bronze: {
        code: "bronze",
        title: "Bronze",
        subtitle: "Free Community Access",
        price: 0,
        games: 0,
        popular: false,
        can_vote: false,
        badgeCls: "bg-slate-200 text-slate-800",
        benefits: ["Community chat & updates", "Tournament viewer access", "No match play quota", "No voting rights"]
      },
      silver: {
        code: "silver",
        title: "Silver",
        subtitle: "Casual Matchday",
        price: 1125,
        games: 4,
        popular: false,
        can_vote: true,
        badgeCls: "bg-slate-200 text-slate-700",
        benefits: ["4 Included match sessions", "Vote in match polls", "Silver member badge", "Standard RSVP window"]
      },
      gold: {
        code: "gold",
        title: "Gold",
        subtitle: "Active Footballer",
        price: 3375,
        games: 12,
        popular: true,
        can_vote: true,
        badgeCls: "bg-amber-100 text-amber-900 border border-amber-300",
        benefits: ["12 Included match sessions", "Priority RSVP access", "Vote in match polls", "Gold member profile badge", "Tournament invite priority"]
      },
      platinum: {
        code: "platinum",
        title: "Platinum",
        subtitle: "Annual Pro VIP",
        price: 13500,
        games: 48,
        popular: false,
        can_vote: true,
        badgeCls: "bg-emerald-100 text-emerald-900 border border-emerald-300",
        benefits: ["48 Full match sessions", "Guaranteed slot every week", "VIP community badge", "Exclusive tournament jersey", "Captaincy voting rights"]
      }
    };

    const plansContainer = document.getElementById("plans");

    function renderPlans(plans) {
      plansContainer.innerHTML = Object.values(plans)
        .map(plan => `
          <div class="relative bg-white rounded-2xl border ${plan.popular ? 'border-amber-400 ring-2 ring-amber-400/30 shadow-xl' : 'border-slate-200 shadow-sm'} p-6 flex flex-col justify-between hover:shadow-lg transition">
            ${plan.popular ? '<span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 font-extrabold text-[11px] uppercase tracking-wider px-3 py-0.5 rounded-full shadow">Most Popular</span>' : ''}
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <h3 class="text-xl font-bold text-slate-900">${plan.title}</h3>
                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${plan.badgeCls}">${plan.code.toUpperCase()}</span>
              </div>
              <p class="text-xs text-slate-500 mb-4">${plan.subtitle}</p>
              
              <div class="mb-4">
                <span class="text-3xl font-extrabold text-slate-900">₹${plan.price.toLocaleString('en-IN')}</span>
                <span class="text-xs text-slate-500 font-normal"> / package</span>
              </div>

              <div class="p-3 bg-slate-50 rounded-xl mb-6 border border-slate-100">
                <div class="text-xs font-semibold text-slate-700">Included Games:</div>
                <div class="text-base font-bold text-emerald-600">${plan.games > 0 ? plan.games + ' Matches' : 'None (Viewer only)'}</div>
              </div>

              <div class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Benefits:</div>
              <ul class="text-xs text-slate-600 space-y-2 mb-6">
                ${plan.benefits.map(b => `<li class="flex items-center gap-2"><span class="text-emerald-500 font-bold">✓</span> ${b}</li>`).join("")}
              </ul>
            </div>

            <a href="../pages/register.html?plan=${plan.code}"
               class="w-full py-2.5 rounded-xl text-center text-sm font-bold transition ${plan.popular ? 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-md' : 'bg-slate-900 hover:bg-slate-800 text-white'}">
              ${plan.price === 0 ? "Join Free" : "Join " + plan.title}
            </a>
          </div>
        `)
        .join("");
    }

    renderPlans(PLANS);
  </script>

</body>
</html>
