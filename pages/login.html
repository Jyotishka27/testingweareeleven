<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — We Are Eleven</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Favicon -->
  <link rel="icon" href="../assets/group-logo/we_are_eleven_logo.jpg" />
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen antialiased">

  <!-- Shared Header -->
  <div id="site-header"></div>

  <main class="flex-grow flex items-center justify-center py-16 px-4 sm:px-6">
    <div class="bg-white border border-slate-200 shadow-xl rounded-3xl p-8 max-w-md w-full">
      <div class="text-center mb-6">
        <img src="../assets/group-logo/we_are_eleven_logo.jpg" alt="We Are Eleven" class="w-16 h-16 rounded-full mx-auto mb-3 ring-4 ring-emerald-50 shadow-sm object-cover">
        <h1 class="text-2xl font-extrabold text-slate-900">Welcome Back</h1>
        <p class="text-xs text-slate-500 mt-1">
          Login to access your profile, manage membership, and participate in community votes.
        </p>
      </div>

      <form id="loginForm" class="space-y-4" autocomplete="on">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1" for="email">Email Address</label>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition"
            required />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1" for="password">Password</label>
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition"
            required />
        </div>

        <button
          id="loginBtn"
          class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-md transition"
          type="submit">
          Sign In
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs text-slate-600">
        <a href="../pages/join.html" class="hover:text-emerald-600 font-semibold transition">
          Create an account
        </a>
        <a href="../pages/forgetpassword.html" id="forgotLink" class="hover:text-slate-900 transition">
          Forgot password?
        </a>
      </div>

      <p id="authMessage" class="text-center text-xs mt-4"></p>
    </div>
  </main>

  <footer class="bg-slate-950 py-8 text-center text-slate-400 text-sm border-t border-slate-800">
    © 2026 We Are Eleven Community. All Rights Reserved.
  </footer>

  <script type="module">
    /* ---------- Shared Header ---------- */
    import { injectHeader } from "../scripts/header.js";
    injectHeader("#site-header", { active: "login" });

    /* ---------- Firebase Auth ---------- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0DaaYB1hZLY8h23QOpT7Ok4sX5ACkHTM",
      authDomain: "we-are-eleven.firebaseapp.com",
      projectId: "we-are-eleven",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const authMessage = document.getElementById("authMessage");
    const loginBtn = document.getElementById("loginBtn");

    function setMessage(text, kind = "info") {
      authMessage.textContent = text;
      authMessage.className = "text-center text-xs mt-4 font-medium";

      if (kind === "error") authMessage.classList.add("text-rose-600");
      if (kind === "success") authMessage.classList.add("text-emerald-600");
      if (kind === "info") authMessage.classList.add("text-slate-500");
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMessage("", "info");

      loginBtn.disabled = true;
      loginBtn.style.opacity = 0.85;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        setMessage("✅ Login successful. Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "../pages/profile.html";
        }, 700);
      } catch (err) {
        console.error("Login error", err);
        setMessage("❌ " + (err.message || "Login failed"), "error");
        loginBtn.disabled = false;
        loginBtn.style.opacity = 1;
      }
    });

    // Forgot password shortcut
    document.getElementById("forgotLink").addEventListener("click", async (ev) => {
      ev.preventDefault();

      const email = document.getElementById("email").value.trim();
      if (!email) {
        window.location.href = "../pages/forgetpassword.html";
        return;
      }

      try {
        await sendPasswordResetEmail(auth, email);
        setMessage("✅ Password reset email sent. Check your inbox.", "success");
      } catch (err) {
        console.error("Reset error", err);
        setMessage("❌ " + (err.message || "Could not send reset email"), "error");
      }
    });
  </script>

</body>
</html>
