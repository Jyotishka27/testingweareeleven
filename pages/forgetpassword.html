<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password — We Are Eleven</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Favicon -->
  <link rel="icon" href="../assets/group-logo/we_are_eleven_logo.jpg" />

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen antialiased">

  <!-- Shared Header -->
  <div id="site-header"></div>

  <main class="flex-grow flex items-center justify-center py-16 px-4 sm:px-6">
    <div class="bg-white border border-slate-200 shadow-xl rounded-3xl p-8 max-w-md w-full">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-extrabold text-slate-900">Forgot Password?</h1>
        <p class="text-xs text-slate-500 mt-1">
          Enter the email address associated with your account and we’ll send you a link to reset your password.
        </p>
      </div>

      <form
        id="resetForm"
        class="space-y-4"
        autocomplete="on"
        aria-label="Password reset form">

        <div>
          <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
            Email Address
          </label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition"
            required
            aria-required="true" />
        </div>

        <button
          id="sendBtn"
          type="submit"
          class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-md transition">
          Send Reset Email
        </button>
      </form>

      <p id="msg" class="text-center text-xs mt-4"></p>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-600">
        <a href="../pages/login.html" class="hover:text-emerald-600 font-semibold transition">
          ← Back to login
        </a>
      </div>
    </div>
  </main>

  <footer class="bg-slate-950 py-8 text-center text-slate-400 text-sm border-t border-slate-800">
    © 2026 We Are Eleven Community. All Rights Reserved.
  </footer>

  <!-- Header + Firebase Logic -->
  <script type="module">
    /* ---------- Shared Header ---------- */
    import { injectHeader } from "../scripts/header.js";
    injectHeader("#site-header", { active: "login" });

    /* ---------- Firebase ---------- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0DaaYB1hZLY8h23QOpT7Ok4sX5ACkHTM",
      authDomain: "we-are-eleven.firebaseapp.com",
      projectId: "we-are-eleven",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const resetForm = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const sendBtn = document.getElementById("sendBtn");
    const msg = document.getElementById("msg");

    function setMessage(text, kind = "info") {
      msg.textContent = text;
      msg.className = "text-center text-xs mt-4 font-medium";

      if (kind === "success") msg.classList.add("text-emerald-600");
      if (kind === "error") msg.classList.add("text-rose-600");
      if (kind === "info") msg.classList.add("text-slate-500");
    }

    resetForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMessage("", "info");

      const email = emailInput.value.trim();
      if (!email) {
        setMessage("❌ Please enter your email address.", "error");
        return;
      }

      sendBtn.disabled = true;
      sendBtn.style.opacity = 0.85;

      try {
        await sendPasswordResetEmail(auth, email);
        setMessage(
          "✅ Password reset email sent. Check your inbox (and spam).",
          "success"
        );
        emailInput.value = "";
      } catch (err) {
        console.error("Reset password error:", err);
        const code = err?.code || "";

        if (code === "auth/user-not-found") {
          setMessage("❌ No account found with that email.", "error");
        } else if (code === "auth/invalid-email") {
          setMessage("❌ Invalid email address.", "error");
        } else {
          setMessage("❌ Could not send reset email. Try again later.", "error");
        }
      } finally {
        sendBtn.disabled = false;
        sendBtn.style.opacity = 1;
      }
    });
  </script>

</body>
</html>
