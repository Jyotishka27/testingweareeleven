<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — We Are Eleven</title>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Favicon -->
  <link rel="icon" href="../assets/group-logo/we_are_eleven_logo.jpg" />
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: #f8fafc;
      color: #0f172a;
    }
  </style>
</head>

<body class="flex flex-col min-h-screen antialiased">

  <!-- Shared Header -->
  <div id="site-header"></div>

  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6">
    <div class="bg-white border border-slate-200 shadow-xl rounded-3xl p-8 max-w-md w-full">
      <div class="text-center mb-6">
        <h1 id="title" class="text-2xl font-extrabold text-slate-900">Join We Are Eleven</h1>
        <p id="subtitle" class="text-xs text-slate-500 mt-1">
          Create your account and join Kolkata's growing grassroots football community.
        </p>
      </div>

      <!-- Plan Summary -->
      <div id="planCard" class="bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-6">
        <div class="flex items-center justify-between">
          <h3 id="planTitle" class="text-base font-bold text-slate-900"></h3>
          <p id="planPrice" class="font-extrabold text-emerald-600 text-sm"></p>
        </div>
        <p id="planGames" class="text-xs text-slate-600 mt-1"></p>
        <ul id="planBenefits" class="text-xs text-slate-600 space-y-1 my-2"></ul>
        <p id="planNote" class="text-[11px] text-slate-400 italic"></p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" class="space-y-4" autocomplete="on">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1" for="name">Full Name</label>
          <input id="name" type="text" placeholder="John Doe" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition" required />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1" for="email">Email Address</label>
          <input id="email" type="email" placeholder="you@example.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition" required />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1" for="password">Password</label>
          <input id="password" type="password" placeholder="Min 6 characters" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition" required />
        </div>

        <!-- Agreement checkbox for paid plans -->
        <div id="paidAgreement" class="hidden text-xs text-slate-600 p-3 bg-amber-50 rounded-xl border border-amber-200">
          <label class="flex items-start gap-2 cursor-pointer">
            <input id="agree" type="checkbox" class="mt-0.5 rounded text-amber-600" />
            <span>
              I agree to pay for the selected plan and understand my registration will be pending until payment verification.
            </span>
          </label>
        </div>

        <button id="submitBtn" type="submit" class="w-full py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-md transition">
          Create Account
        </button>
      </form>

      <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-600">
        Already have an account? <a href="../pages/login.html" class="hover:text-emerald-600 font-bold transition">Sign in here</a>
      </div>

      <p id="authMessage" class="text-center text-xs mt-4"></p>
    </div>
  </main>

  <footer class="bg-slate-950 py-8 text-center text-slate-400 text-sm border-t border-slate-800">
    © 2026 We Are Eleven Community. All Rights Reserved.
  </footer>

  <script type="module">
    /* ---------- Header ---------- */
    import { injectHeader } from "../scripts/header.js";
    injectHeader("#site-header", { active: "register" });

    /* ---------- Firebase ---------- */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB0DaaYB1hZLY8h23QOpT7Ok4sX5ACkHTM",
      authDomain: "we-are-eleven.firebaseapp.com",
      projectId: "we-are-eleven",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ---------- Plans ---------- */
    const PLANS = {
      bronze: {
        code: "bronze",
        title: "Bronze (Free Play)",
        price: 0,
        games: 0,
        can_vote: false,
        benefits: ["Community access", "Voting not allowed"]
      },
      silver: {
        code: "silver",
        title: "Silver",
        price: 1125,
        games: 4,
        can_vote: true,
        benefits: ["Can vote in polls", "Silver badge"]
      },
      gold: {
        code: "gold",
        title: "Gold",
        price: 3375,
        games: 12,
        can_vote: true,
        benefits: ["Can vote in polls", "Priority perks", "Gold badge"]
      },
      platinum: {
        code: "platinum",
        title: "Platinum",
        price: 13500,
        games: 48,
        can_vote: true,
        benefits: ["Can vote in polls", "VIP perks", "Platinum badge"]
      }
    };

    /* ---------- Read plan ---------- */
    const params = new URLSearchParams(window.location.search);
    const planCode = (params.get("plan") || "bronze").toLowerCase();
    const plan = PLANS[planCode] || PLANS.bronze;

    /* ---------- UI refs ---------- */
    const planTitle = document.getElementById("planTitle");
    const planPrice = document.getElementById("planPrice");
    const planGames = document.getElementById("planGames");
    const planBenefits = document.getElementById("planBenefits");
    const planNote = document.getElementById("planNote");
    const paidAgreement = document.getElementById("paidAgreement");
    const registerForm = document.getElementById("registerForm");
    const authMessage = document.getElementById("authMessage");
    const submitBtn = document.getElementById("submitBtn");

    /* ---------- Populate plan UI ---------- */
    planTitle.textContent = plan.title;
    planPrice.textContent = plan.price === 0 ? "₹0" : `₹${plan.price}`;
    planGames.textContent = `Includes ${plan.games} games`;
    planBenefits.innerHTML = plan.benefits.map(b => `<li>• ${b}</li>`).join("");
    planNote.textContent =
      plan.price === 0
        ? "Free membership — voting is not allowed for Bronze."
        : "Paid membership — admin will verify payment and activate your membership.";

    paidAgreement.classList.toggle("hidden", plan.price === 0);

    function setMessage(text, kind = "info") {
      authMessage.textContent = text;
      authMessage.className = "text-center text-sm mt-4";
      if (kind === "error") authMessage.classList.add("wae-error");
      if (kind === "success") authMessage.classList.add("wae-success");
      if (kind === "info") authMessage.classList.add("wae-muted");
    }

    /* ---------- Register ---------- */
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMessage("");
      submitBtn.disabled = true;
      submitBtn.style.opacity = 0.85;

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const agree = document.getElementById("agree")?.checked || false;

      if (!name || !email || !password) {
        setMessage("❌ Please complete all fields.", "error");
        submitBtn.disabled = false;
        submitBtn.style.opacity = 1;
        return;
      }

      if (plan.price > 0 && !agree) {
        setMessage("❌ Please agree to the payment terms.", "error");
        submitBtn.disabled = false;
        submitBtn.style.opacity = 1;
        return;
      }

      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });

        const uid = cred.user.uid;

        const membership_status = plan.price === 0 ? "active" : "pending_payment";

        await setDoc(doc(db, "users", uid), {
          displayName: name,
          email,
          membership: plan.code,
          membership_status,
          games_remaining: plan.price === 0 ? plan.games : 0,
          can_vote: plan.price === 0 ? plan.can_vote : false,
          created_at: serverTimestamp()
        });

        setMessage("✅ Registration successful. Redirecting…", "success");

        setTimeout(() => {
          window.location.href = "../pages/profile.html";
        }, 900);

      } catch (err) {
        console.error(err);
        setMessage("❌ " + (err.message || "Registration failed"), "error");
        submitBtn.disabled = false;
        submitBtn.style.opacity = 1;
      }
    });
  </script>

</body>
</html>
